{% extends 'layout.html' %}
{% block content %}
<div class="d-flex justify-content-between align-items-center">
  <h4>Welcome, {{user}}</h4>
  <div>
    <a class="btn btn-sm btn-secondary" href="/receipts">My Receipts</a>
    <a class="btn btn-sm btn-warning" href="/logout">Logout</a>
  </div>
</div>
<hr>
<div class="mb-3">
  <h5>Register for Events (₹200)</h5>
  <a class="btn btn-outline-primary" href="/register/PPT">PPT</a>
  <a class="btn btn-outline-primary" href="/register/Quiz">Quiz</a>
  <a class="btn btn-outline-primary" href="/register/Dance">Dance</a>
</div>
<div class="card">
  <div class="card-body">
    <h5>Personal Notes</h5>
    <form method="post" action="/save_notes">
      <textarea name="notes" class="form-control" rows="8">{{notes}}</textarea>
      <button class="btn btn-primary mt-2">Save Notes</button>
    </form>
  </div>
</div>
{% endblock %}
