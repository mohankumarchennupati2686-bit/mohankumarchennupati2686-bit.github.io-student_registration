{% extends 'layout.html' %}
{% block content %}
<div class="card mx-auto" style="max-width:420px;">
  <div class="card-body">
    <h3 class="card-title">Sign Up</h3>
    <form method="post">
      <div class="mb-2">
        <input class="form-control" name="username" placeholder="Choose username">
      </div>
      <div class="mb-2">
        <input class="form-control" name="password" type="password" placeholder="Choose password">
      </div>
      <button class="btn btn-success" type="submit">Register</button>
      <a class="btn btn-link" href="/login">Back to login</a>
    </form>
  </div>
</div>
{% endblock %}
